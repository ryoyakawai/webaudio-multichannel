<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>High-Visibility Audio Router v3</title>
    <link rel="stylesheet" href="style.css">
    <style>
     body {
       font-family: 'Inter', sans-serif;
       background: #121212;
       color: #eee;
       margin: 0;
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
       min-height: 100vh;
       padding: 20px;
       box-sizing: border-box;
       justify-content: center;
     }
     .controls {
       background: #1e1e1e; padding: 24px;
       border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
       width: fit-content; min-width: 450px;
       max-width: 95vw; border: 1px solid #333;
       margin-bottom: 30px;
     }

     h3 {
       margin-top: 0; color: #00a86b; font-size: 1.1em;
       border-bottom: 1px solid #333; padding-bottom: 10px;
       margin-bottom: 20px; text-transform: uppercase;
     }

     .config-row { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
     .input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; }
     .input-group label { font-size: 12px; color: #888; font-weight: bold; }

     select, button { padding: 12px; border-radius: 6px; border: none; font-size: 14px; outline: none; }
     select { background: #2a2a2a; color: white; border: 1px solid #444; cursor: pointer; }

     button { background: #00a86b; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
     button:hover { background: #00cf83; }

     #meter-container { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }

     .channel-wrapper {
       background: #1e1e1e;
       padding: 15px 10px;
       border-radius: 8px;
       border: 1px solid #333;
       display: flex;
       flex-direction: column;
       align-items: center;
       gap: 12px;
       width: fit-content;
     }

     .label {
       font-size: 1.2em;
       color: #00a86b;
       font-family: 'JetBrains Mono', 'Courier New', monospace;
       font-weight: bold;
     }

     .meter-bg {
       width: 35px;
       height: 250px;
       background: #000;
       position: relative;
       border: 1px solid #222;
       border-radius: 2px;
       overflow: hidden;
     }

     .meter-bg.muted {
       opacity: 0.2;
       filter: grayscale(0.6);
       transition: opacity 0.3s, filter 0.3s;
     }

     .meter-scale {
       position: absolute; width: 100%; height: 100%;
       background: linear-gradient(to top, #2ecc71 0%, #2ecc71 70%, #f1c40f 70%, #f1c40f 90%, #e74c3c 90%, #e74c3c 100%);
       opacity: 0.1;
     }
     .meter-fill {
       position: absolute; width: 100%; height: 100%;
       background: linear-gradient(to top, #2ecc71 0%, #2ecc71 70%, #f1c40f 70%, #f1c40f 90%, #e74c3c 90%, #e74c3c 100%);
       clip-path: inset(100% 0 0 0); transition: clip-path 0.05s linear;
     }
     .meter-grid {
       position: absolute; width: 100%; height: 100%;
       background-image: linear-gradient(to bottom, transparent 96%, rgba(0,0,0,0.4) 96%);
       background-size: 100% 12px; z-index: 2;
     }

     .db-value {
       font-size: 0.8em;
       color: #ccc;
       font-family: 'JetBrains Mono', monospace;
       margin-top: -4px;
       min-height: 1.2em;
     }

     .route-select {
       width: auto;
       font-size: 1.2em;
       padding: 6px 10px;
       background: #111;
       color: #eee;
       border: 1px solid #444;
       border-radius: 4px;
       cursor: pointer;
     }

    </style>
  </head>
  <body>
    <a href="index.html" class="home-btn" title="Go back to Index">
      🏠 <span style="font-size: 0.7em; font-weight: bold; text-transform: uppercase;">Index</span>
    </a>

    <div class="controls">
      <h3>Routing Console</h3>
      <div class="config-row">
        <div class="input-group">
          <label>IN DEVICE</label>
          <select id="input-select"><option>Scanning devices...</option></select>
        </div>
        <div class="input-group">
          <label>OUT DEVICE</label>
          <select id="output-select"><option>Scanning devices...</option></select>
        </div>
      </div>
      <button id="start-btn" style="width: 100%;">START MONITORING</button>
    </div>

    <div id="meter-container"></div>

    <script>
     const inputSelect = document.getElementById('input-select');
     const outputSelect = document.getElementById('output-select');
     const startBtn = document.getElementById('start-btn');
     const container = document.getElementById('meter-container');

     let audioCtx;
     let animationId;

     async function refreshDevices() {
       try {
         const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
         tempStream.getTracks().forEach(t => t.stop());
         const devices = await navigator.mediaDevices.enumerateDevices();
         const inputs = devices.filter(d => d.kind === 'audioinput');
         const outputs = devices.filter(d => d.kind === 'audiooutput');
         inputSelect.innerHTML = inputs.map(d => `<option value="${d.deviceId}">${d.label || 'Input'}</option>`).join('');
         outputSelect.innerHTML = outputs.map(d => `<option value="${d.deviceId}">${d.label || 'Output'}</option>`).join('');
       } catch (err) { console.error(err); }
     }
     refreshDevices();

     startBtn.onclick = async () => {
       if (audioCtx) {
         await audioCtx.close();
         cancelAnimationFrame(animationId);
         container.innerHTML = '';
       }

       audioCtx = new AudioContext();
       const outDeviceId = outputSelect.value;
       if (outDeviceId && typeof audioCtx.setSinkId === 'function') {
         await audioCtx.setSinkId(outDeviceId);
       }

       const outMaxChannels = audioCtx.destination.maxChannelCount;
       audioCtx.destination.channelCount = outMaxChannels;
       audioCtx.destination.channelInterpretation = "discrete";

       const constraints = {
         audio: {
           deviceId: { exact: inputSelect.value },
           channelCount: 32,
           echoCancellation: false,
           noiseSuppression: false,
           autoGainControl: false
         }
       };

       try {
         const stream = await navigator.mediaDevices.getUserMedia(constraints);
         const source = audioCtx.createMediaStreamSource(stream);
         const inChannels = stream.getAudioTracks()[0].getSettings().channelCount || 1;

         source.channelCount = inChannels;
         source.channelInterpretation = "discrete";

         const inSplitter = audioCtx.createChannelSplitter(inChannels);
         const outMerger = audioCtx.createChannelMerger(outMaxChannels);
         source.connect(inSplitter);
         outMerger.connect(audioCtx.destination);

         const meters = [];
         for (let i = 0; i < inChannels; i++) {
           const analyser = audioCtx.createAnalyser();
           analyser.fftSize = 256;
           inSplitter.connect(analyser, i);

           const channelGain = audioCtx.createGain();
           inSplitter.connect(channelGain, i);

           const wrapper = document.createElement('div');
           wrapper.className = 'channel-wrapper';

           let outputOptions = `<option value="-1">MUTE</option>`;
           for(let outIdx=0; outIdx < outMaxChannels; outIdx++) {
             outputOptions += `<option value="${outIdx}">OUT ${outIdx+1}</option>`;
           }

           wrapper.innerHTML = `
                        <div class="label">IN ${i + 1}</div>
                        <div class="meter-bg">
                            <div class="meter-scale"></div>
                            <div class="meter-fill" id="fill-${i}"></div>
                            <div class="meter-grid"></div>
                        </div>
                        <div class="db-value" id="val-${i}">-inf</div>
                        <select class="route-select" id="route-${i}">${outputOptions}</select>
                    `;
           container.appendChild(wrapper);

           const routeSelect = document.getElementById(`route-${i}`);
           if (i < outMaxChannels) {
             routeSelect.value = i;
             channelGain.connect(outMerger, 0, i);
           }

           routeSelect.onchange = () => {
             channelGain.disconnect();
             const target = parseInt(routeSelect.value);
             const meterBg = wrapper.querySelector('.meter-bg');

             if (target !== -1) {
               channelGain.connect(outMerger, 0, target);
               meterBg.classList.remove('muted');
             } else {
               meterBg.classList.add('muted');
             }
           };

           meters.push({
             analyser,
             data: new Uint8Array(analyser.frequencyBinCount),
             element: document.getElementById(`fill-${i}`),
             textElement: document.getElementById(`val-${i}`)
           });
         }

         const update = () => {
           meters.forEach(m => {
             m.analyser.getByteFrequencyData(m.data);
             const avg = m.data.reduce((a, b) => a + b) / m.data.length;

             const volumePercent = Math.min(100, (avg / 140) * 100);
             m.element.style.clipPath = `inset(${100 - volumePercent}% 0 0 0)`;

             // dB計算（0.1〜255をdBFSっぽくスケーリング）
             const db = avg > 0 ? Math.round(20 * Math.log10(avg / 255)) : -Infinity;
             m.textElement.textContent = db === -Infinity ? "-inf" : `${db} dB`;
           });
           animationId = requestAnimationFrame(update);
         };
         update();
         startBtn.textContent = "RESTART / UPDATE";

       } catch (err) { alert("Microphone access failed."); }
     };
    </script>
  </body>
</html>
