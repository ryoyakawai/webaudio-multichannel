<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Channel Audio Router</title>
    <style>
     :root {
       --bg-color: #121212;
       --panel-color: #1e1e1e;
       --accent-color: #2df6a3; /* ご指定の #2df6a3 */
       --text-color: #eeeeee;
     }
     body {
       font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
       background-color: var(--bg-color);
       color: var(--text-color);
       margin: 0;
       padding: 20px;
       display: flex;
       flex-direction: column;
       align-items: center;
     }
     .controls {
       background: var(--panel-color);
       padding: 20px;
       border-radius: 12px;
       box-shadow: 0 4px 15px rgba(0,0,0,0.5);
       margin-bottom: 30px;
       width: 100%;
       max-width: 800px;
     }
     .config-row {
       display: grid;
       grid-template-columns: 1fr 1fr;
       gap: 20px;
       margin-bottom: 20px;
     }
     select, button {
       width: 100%;
       padding: 10px;
       background: #2a2a2a;
       color: white;
       border: 1px solid #444;
       border-radius: 6px;
       font-size: 14px;
     }
     button {
       background: var(--accent-color);
       color: #121212;
       font-weight: bold;
       cursor: pointer;
       border: none;
       transition: 0.2s;
     }
     button:hover { opacity: 0.9; transform: translateY(-1px); }

     #meter-container {
       display: grid;
       grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
       gap: 15px;
       width: 100%;
       max-width: 1000px;
     }
     .channel-wrapper {
       background: var(--panel-color);
       padding: 15px;
       border-radius: 8px;
       text-align: center;
       border: 1px solid #333;
     }
     .label { font-weight: bold; margin-bottom: 10px; font-size: 0.9em; color: var(--accent-color); }

     .meter-bg {
       height: 150px;
       width: 30px;
       background: #111;
       margin: 0 auto 10px;
       position: relative;
       border-radius: 3px;
       overflow: hidden;
       border: 1px solid #444;
     }
     .meter-fill {
       position: absolute;
       bottom: 0;
       width: 100%;
       height: 100%;
       background: linear-gradient(to top, var(--accent-color), #f6ff00, #ff4444);
       transform-origin: bottom;
       transition: 0.05s;
     }
     .meter-bg.muted { opacity: 0.15; filter: grayscale(1); }

     .db-value { font-family: monospace; font-size: 0.8em; margin-bottom: 10px; }
     .route-select { font-size: 0.75em; padding: 5px; }
    </style>
  </head>
  <body>

    <div class="controls">
      <h2 style="margin-top:0">Multi-Channel Routing Console</h2>
      <div class="config-row">
        <div>
          <label>INPUT DEVICE</label>
          <select id="input-select"></select>
        </div>
        <div>
          <label>OUTPUT DEVICE</label>
          <select id="output-select"></select>
        </div>
      </div>
      <button id="start-btn">INITIALIZE AUDIO ENGINE</button>
    </div>

    <div id="meter-container"></div>

    <script>
     const inputSelect = document.getElementById('input-select');
     const outputSelect = document.getElementById('output-select');
     const startBtn = document.getElementById('start-btn');
     const container = document.getElementById('meter-container');

     let audioCtx, animationId;
     let inputNodes = []; // 各チャンネルのノード管理用

     // デバイス情報の取得
     async function initDevices() {
       try {
         const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
         stream.getTracks().forEach(t => t.stop());
         const devs = await navigator.mediaDevices.enumerateDevices();

         inputSelect.innerHTML = devs.filter(d => d.kind === 'audioinput')
                                     .map(d => `<option value="${d.deviceId}">${d.label}</option>`).join('');
         outputSelect.innerHTML = devs.filter(d => d.kind === 'audiooutput')
                                      .map(d => `<option value="${d.deviceId}">${d.label}</option>`).join('');
       } catch (e) { alert("Please allow microphone access."); }
     }
     initDevices();

     startBtn.onclick = async () => {
       if (audioCtx) {
         await audioCtx.close();
         cancelAnimationFrame(animationId);
         container.innerHTML = '';
         inputNodes = [];
       }

       audioCtx = new AudioContext();

       // Firefoxでの出力先指定 (setSinkId)
       if (outputSelect.value && typeof audioCtx.setSinkId === 'function') {
         await audioCtx.setSinkId(outputSelect.value);
       }

       // デバイスの最大チャンネル数を取得して設定
       const outMax = audioCtx.destination.maxChannelCount;
       audioCtx.destination.channelCount = outMax;
       audioCtx.destination.channelInterpretation = "discrete";

       try {
         const stream = await navigator.mediaDevices.getUserMedia({
           audio: {
             deviceId: { exact: inputSelect.value },
             channelCount: 32, // 最大値を要求
             echoCancellation: false, noiseSuppression: false, autoGainControl: false
           }
         });

         const source = audioCtx.createMediaStreamSource(stream);
         const inCh = stream.getAudioTracks()[0].getSettings().channelCount || 1;

         source.channelCount = inCh;
         source.channelInterpretation = "discrete";

         const splitter = audioCtx.createChannelSplitter(inCh);
         const merger = audioCtx.createChannelMerger(outMax);
console.log( `in=[${inCh}] out=[${outMax}]` )

         source.connect(splitter);
         merger.connect(audioCtx.destination);

         for (let i = 0; i < inCh; i++) {
           const analyser = audioCtx.createAnalyser();
           const gain = audioCtx.createGain();
           analyser.fftSize = 256;

           splitter.connect(analyser, i);
           splitter.connect(gain, i);

           // UI生成
           const wrap = document.createElement('div');
           wrap.className = 'channel-wrapper';

           let options = `<option value="-1">MUTE</option>`;
           for(let j=0; j<outMax; j++) {
             options += `<option value="${j}">OUT ${j+1}</option>`;
           }

           wrap.innerHTML = `
                        <div class="label">IN ${i + 1}</div>
                        <div class="meter-bg" id="bg-${i}"><div class="meter-fill" id="fill-${i}"></div></div>
                        <div class="db-value" id="db-${i}">-inf</div>
                        <select class="route-select" id="sel-${i}">${options}</select>
                    `;
           container.appendChild(wrap);

           const sel = document.getElementById(`sel-${i}`);
           const bg = document.getElementById(`bg-${i}`);

           // ルーティング変更イベント
           sel.onchange = () => {
             gain.disconnect();
             const destIdx = parseInt(sel.value);
             if (destIdx !== -1) {
               gain.connect(merger, 0, destIdx); // Mergerの指定チャンネルに接続
               bg.classList.remove('muted');
             } else {
               bg.classList.add('muted');
             }
           };

           // 初期状態: 1:1接続 (入力数が出力数を超えない範囲で)
           if (i < outMax) {
             sel.value = i;
             gain.connect(merger, 0, i);
           } else {
             bg.classList.add('muted');
           }

           inputNodes.push({
             analyser,
             data: new Uint8Array(128),
             fill: document.getElementById(`fill-${i}`),
             text: document.getElementById(`db-${i}`)
           });
         }

         // メーター更新ループ
         const draw = () => {
           inputNodes.forEach(node => {
             node.analyser.getByteFrequencyData(node.data);
             let sum = 0;
             for(let x=0; x<node.data.length; x++) sum += node.data[x];
             const avg = sum / node.data.length;

             // 視覚的なボリューム調整
             const val = Math.min(100, (avg / 140) * 100);
             node.fill.style.transform = `scaleY(${val / 100})`;

             const db = avg > 0 ? Math.round(20 * Math.log10(avg / 255)) : -Infinity;
             node.text.textContent = db === -Infinity ? "-inf" : `${db} dB`;
           });
           animationId = requestAnimationFrame(draw);
         };
         draw();
         startBtn.textContent = "ENGINE RUNNING (CLICK TO RESTART)";

       } catch (err) {
         alert("Error: " + err.message);
       }
     };
    </script>
  </body>
</html>
