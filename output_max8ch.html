<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>10ch Output Master | Dynamic UI</title>
    <style>
     body { font-family: 'Inter', system-ui, sans-serif; background: #cbd5e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
     .container { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); width: 95%; max-width: 900px; }
     h3 { border-bottom: 2px solid #edf2f7; padding-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; }

     /* status panel */
     .status-panel { background: #1a202c; color: #4fd1c5; padding: 15px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; margin-bottom: 20px; display: flex; justify-content: space-between; }

     .config-row { display: flex; gap: 15px; margin-bottom: 25px; align-items: flex-end; }
     .input-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }
     .input-group label { font-size: 11px; font-weight: 800; color: #718096; }

     select, button { padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 14px; outline: none; }
     select { background: #f8fafc; cursor: pointer; }
     button { background: #1a202c; color: white; cursor: pointer; font-weight: 800; text-transform: uppercase; transition: 0.2s; border: none; }
     button:hover { background: #000; transform: translateY(-1px); }
     button:disabled { background: #cbd5e0; cursor: not-allowed; transform: none; }

     /* style of table */
     table { width: 100%; border-collapse: collapse; margin-bottom: 20px; table-layout: fixed; }
     th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; }
     th { background: #f8fafc; font-size: 10px; color: #4a5568; }
     td { font-size: 13px; font-weight: bold; }

     /* Active / In-Active control */
     .disabled-cell { background-color: #f1f5f9 !important; color: #cbd5e0 !important; }
     .disabled-cell input { opacity: 0.2; cursor: not-allowed; }
     input[type="checkbox"] { transform: scale(1.4); cursor: pointer; accent-color: #1a202c; }

     #error-log { color: #e53e3e; text-align: center; font-size: 12px; font-weight: bold; margin-top: 10px; min-height: 1.2em; }
    </style>
  </head>
  <body>

    <div class="container">
      <h3>10-Channel Output Master</h3>

      <div class="status-panel">
        <span id="status-text">SYSTEM READY</span>
        <span id="ch-info">DETECTED: -- CH</span>
      </div>

      <div class="config-row">
        <div class="input-group">
          <label>SELECT OUTPUT DEVICE (e.g. UMC1820)</label>
          <select id="device-list">
            <option value="">Default System Output</option>
          </select>
        </div>
        <button id="refresh-btn" style="width: auto;">Refresh List</button>
      </div>

      <table id="matrix-table">
        <thead><tr id="h-row"><th>Note</th></tr></thead>
        <tbody id="b-row"></tbody>
      </table>

      <button id="play-btn" style="width: 100%; padding: 18px; font-size: 1.1em;">Play Selected Channels</button>
      <div id="error-log"></div>
    </div>

    <script>
     const SCALE = [
       { label: "C (Do)",   freq: 261.63 },
       { label: "D (Re)",   freq: 293.66 },
       { label: "E (Mi)",   freq: 329.63 },
       { label: "F (Fa)", freq: 349.23 },
       { label: "G (So)",   freq: 392.00 },
       { label: "A (La)",   freq: 440.00 },
       { label: "B (Si)",   freq: 493.88 },
       { label: "C5 (Do)",  freq: 523.25 }
     ];
     const TARGET_MAX_CH = 10;

     // 1. Update device list
     async function updateDeviceList() {
       const select = document.getElementById("device-list");
       const current = select.value;
       try {
         // Used for permission prompt
         const s = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
         if (s) s.getTracks().forEach(t => t.stop());

         const devices = await navigator.mediaDevices.enumerateDevices();
         select.innerHTML = '<option value="">Default System Output</option>';
         devices.filter(d => d.kind === 'audiooutput').forEach(d => {
           const opt = document.createElement("option");
           opt.value = d.deviceId;
           opt.text = d.label || `Device ${d.deviceId.slice(0,5)}`;
           if(d.deviceId === current) opt.selected = true;
           select.appendChild(opt);
         });
       } catch (e) { console.error(e); }
     }

     // 2. Rebuild UI (Toggle Active/Inactive based on channel count)
     function renderTable(activeChCount = 2) {
       const hRow = document.getElementById("h-row");
       const bRow = document.getElementById("b-row");
       document.getElementById("ch-info").innerText = `DETECTED: ${activeChCount} CH`;

       // Generate table header
       hRow.innerHTML = '<th>Note</th>';
       for (let i = 0; i < TARGET_MAX_CH; i++) {
         const th = document.createElement("th");
         th.innerText = `CH ${i + 1}`;
         if (i >= activeChCount) th.className = "disabled-cell";
         hRow.appendChild(th);
       }

       // Generate table body
       bRow.innerHTML = '';
       SCALE.forEach(note => {
         const tr = document.createElement("tr");
         tr.innerHTML = `<td>${note.label}</td>`;
         for (let i = 0; i < TARGET_MAX_CH; i++) {
           const td = document.createElement("td");
           const isInactive = i >= activeChCount;
           if (isInactive) td.className = "disabled-cell";
           td.innerHTML = `<input type="checkbox" class="ch-cb" data-f="${note.freq}" data-c="${i}" ${isInactive ? 'disabled' : ''}>`;
           tr.appendChild(td);
         }
         bRow.appendChild(tr);
       });
     }

     // 3. Probe device capabilities on dropdown change
     document.getElementById("device-list").onchange = async function() {
       const deviceId = this.value;
       const status = document.getElementById("status-text");
       status.innerText = "PROBING DEVICE...";

       const probeCtx = new AudioContext({ sampleRate: 48000 });
       try {
         if (deviceId && probeCtx.setSinkId) {
           await probeCtx.setSinkId(deviceId);
         }
         // Wait for OS recognition (handling potential lag)
         await new Promise(r => setTimeout(r, 250));

         const max = probeCtx.destination.maxChannelCount;
         renderTable(max);
         status.innerText = max > 2 ? "MULTI-CH MODE ACTIVE" : "STEREO MODE";
       } catch (e) {
         console.error(e);
         status.innerText = "PROBE FAILED";
       } finally {
         probeCtx.close();
       }
     };

     // 4. Playback processing
     document.getElementById("play-btn").onclick = async function() {
       const btn = this;
       const log = document.getElementById("error-log");
       const deviceId = document.getElementById("device-list").value;
       log.innerText = "";

       const ctx = new AudioContext({ sampleRate: 48000 });
       try {
         if (deviceId && ctx.setSinkId) await ctx.setSinkId(deviceId);
         await new Promise(r => setTimeout(r, 100));

         const max = ctx.destination.maxChannelCount;
         ctx.destination.channelCount = max;
         ctx.destination.channelCountMode = 'explicit';
         ctx.destination.channelInterpretation = 'discrete';

         const selections = document.querySelectorAll(".ch-cb:checked");
         if (selections.length === 0) {
           log.innerText = "SELECT AT LEAST ONE CHECKBOX.";
           ctx.close(); return;
         }

         btn.disabled = true;
         const merger = ctx.createChannelMerger(max);
         merger.connect(ctx.destination);

         const now = ctx.currentTime;
         selections.forEach(cb => {
           const osc = ctx.createOscillator();
           const gain = ctx.createGain();
           osc.frequency.value = parseFloat(cb.dataset.f);
           gain.gain.setValueAtTime(0, now);
           gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
           gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
           osc.connect(gain);
           gain.connect(merger, 0, parseInt(cb.dataset.c));
           osc.start(now); osc.stop(now + 1.5);
         });

         setTimeout(() => { btn.disabled = false; ctx.close(); }, 1600);
       } catch (e) {
         log.innerText = `PLAYBACK ERROR: ${e.message}`;
         btn.disabled = false;
         ctx.close();
       }
     };

     // Initialization
     window.onload = async () => {
       await updateDeviceList();
       const t = new AudioContext();
       renderTable(t.destination.maxChannelCount);
       t.close();
     };
     document.getElementById("refresh-btn").onclick = updateDeviceList;
    </script>
  </body>
</html>
