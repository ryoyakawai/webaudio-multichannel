<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Output 8ch Tester | Web Audio Toolset</title>
    <link rel="stylesheet" href="style.css">
    <style>
     body {
       font-family: 'Inter', sans-serif;
       background: #121212;
       color: #eee;
       margin: 0;
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
       min-height: 100vh;
       padding: 20px;
       box-sizing: border-box;
     }

     .controls {
       background: #1e1e1e;
       padding: 24px;
       border-radius: 12px;
       box-shadow: 0 8px 32px rgba(0,0,0,0.5);
       width: fit-content;
       min-width: 500px;
       max-width: 95vw;
       border: 1px solid #333;
       margin-bottom: 30px;
     }

     h3 {
       margin-top: 0; color: #00a86b; font-size: 1.1em;
       border-bottom: 1px solid #333; padding-bottom: 10px;
       margin-bottom: 20px; text-transform: uppercase;
     }

     .info { font-size: 1.2em; color: #888; margin-bottom: 15px; font-family: monospace; }

     .config-row { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-end; }
     .input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; }
     .input-group label { font-size: 12px; color: #888; font-weight: bold; }

     select, button { padding: 12px; border-radius: 6px; border: none; font-size: 14px; outline: none; }
     select { background: #2a2a2a; color: white; border: 1px solid #444; cursor: pointer; }

     button { background: #00a86b; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
     button:hover { background: #00cf83; }
     button:disabled { background: #444; cursor: not-allowed; }

     /* スケールテーブルのスタイル */
     table {
       border-collapse: collapse;
       width: 100%;
       background: #1e1e1e;
       border-radius: 8px;
       overflow: hidden;
       border: 1px solid #333;
     }
     th, td {
       padding: 12px;
       border: 1px solid #333;
       text-align: center;
     }
     th {
       background: #252525;
       color: #00a86b;
       font-size: 0.8em;
       text-transform: uppercase;
     }
     td { font-size: 1.1em; font-weight: bold; }

     .disabled-cell { background-color: #151515; color: #444; }
     input[type="checkbox"] { transform: scale(1.5); cursor: pointer; accent-color: #00a86b; }

     #error-msg {
       color: #e74c3c;
       margin-top: 20px;
       font-weight: bold;
       font-size: 0.9em;
       min-height: 1.5em;
       text-align: center;
     }
    </style>
  </head>
  <body>
    <a href="index.html" class="home-btn" title="Go back to Index">
      🏠 <span style="font-size: 0.7em; font-weight: bold; text-transform: uppercase;">Index</span>
    </a>

    <div class="controls">
      <h3>8-Channel Output Tester</h3>

      <div id="device-info" class="info">Initializing device info...</div>

      <div class="config-row">
        <div class="input-group">
          <label>SELECT OUTPUT DEVICE</label>
          <select id="device-list">
            <option value="">Default System Output</option>
          </select>
        </div>
        <button id="refresh-devices" style="width: auto;">🔄 Refresh</button>
      </div>

      <table id="scale-table">
        <thead>
          <tr id="header-row">
            <th>Note</th>
          </tr>
        </thead>
        <tbody id="scale-body"></tbody>
      </table>

      <div style="margin-top: 25px;">
        <button id="play" style="width: 100%; font-size: 1.1em;">PLAY SELECTED CHANNELS</button>
        <div id="error-msg"></div>
      </div>

      <p style="font-size: 11px; color: #555; margin-top: 15px; text-align: center;">
        ※If devices are missing, click Refresh or Play once to grant permissions.
      </p>
    </div>

    <script>
     const SCALE = [
       { label: "C (ド)",   freq: 261.63 },
       { label: "D (レ)",   freq: 293.66 },
       { label: "E (ミ)",   freq: 329.63 },
       { label: "F (ファ)", freq: 349.23 },
       { label: "G (ソ)",   freq: 392.00 },
       { label: "A (ラ)",   freq: 440.00 },
       { label: "B (シ)",   freq: 493.88 },
       { label: "C5 (ド)",  freq: 523.25 }
     ];
     const MAX_CH_NUM = 8;

     async function updateDeviceList() {
       const select = document.getElementById("device-list");
       const currentSelection = select.value;
       select.innerHTML = '<option value="">Default System Output</option>';
       try {
         if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
           const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
           if (stream) stream.getTracks().forEach(t => t.stop());
         }
         const devices = await navigator.mediaDevices.enumerateDevices();
         const outputs = devices.filter(d => d.kind === 'audiooutput');
         outputs.forEach(device => {
           const option = document.createElement("option");
           option.value = device.deviceId;
           option.text = device.label || `Speaker (${device.deviceId.slice(0, 5)})`;
           if (device.deviceId === currentSelection) option.selected = true;
           select.appendChild(option);
         });
       } catch (err) { console.error(err); }
     }

     function initUI() {
       const tempCtx = new AudioContext();
       const maxCh = tempCtx.destination.maxChannelCount;
       document.getElementById("device-info").innerText = `🔈 Device Max Channels: ${maxCh}`;

       const headerRow = document.getElementById("header-row");
       const scaleBody = document.getElementById("scale-body");

       headerRow.innerHTML = '<th>Note</th>';
       for (let i = 0; i < MAX_CH_NUM; i++) {
         const th = document.createElement("th");
         th.innerText = `CH ${i+1}`;
         if (i >= maxCh) th.classList.add("disabled-cell");
         headerRow.appendChild(th);
       }

       scaleBody.innerHTML = '';
       SCALE.forEach((note) => {
         const tr = document.createElement("tr");
         tr.innerHTML = `<td>${note.label}</td>`;
         for (let ch = 0; ch < MAX_CH_NUM; ch++) {
           const td = document.createElement("td");
           const disabled = ch >= maxCh ? 'disabled' : '';
           const cellClass = ch >= maxCh ? 'class="disabled-cell"' : '';
           td.innerHTML = `<input type="checkbox" class="note-ch" data-freq="${note.freq}" data-ch="${ch}" ${disabled}>`;
           if (ch >= maxCh) td.className = "disabled-cell";
           tr.appendChild(td);
         }
         scaleBody.appendChild(tr);
       });
       tempCtx.close();
     }

     window.addEventListener("DOMContentLoaded", () => {
       initUI();
       updateDeviceList();
       document.getElementById("refresh-devices").onclick = updateDeviceList;
     });

     document.getElementById("play").addEventListener("click", async function() {
       const playButton = this;
       const errorElement = document.getElementById("error-msg");
       const deviceId = document.getElementById("device-list").value;
       errorElement.innerText = "";

       const ctx = new AudioContext();
       if (typeof ctx.setSinkId === 'function' && deviceId) {
         try { await ctx.setSinkId(deviceId); } catch (err) {
           errorElement.innerText = `⚠️ Device Switch Error: ${err.message}`;
           ctx.close(); return;
         }
       }

       const maxCh = ctx.destination.maxChannelCount;
       ctx.destination.channelCount = maxCh;
       ctx.destination.channelInterpretation = "discrete";

       const merger = ctx.createChannelMerger(MAX_CH_NUM);
       const selections = [];
       let securityError = false;

       document.querySelectorAll(".note-ch:checked").forEach(cb => {
         const ch = Number(cb.dataset.ch);
         if (ch >= maxCh) { securityError = true; return; }
         selections.push({ freq: Number(cb.dataset.freq), channel: ch });
       });

       if (securityError || selections.length === 0) {
         errorElement.innerText = securityError ? `⚠️ Selected device only supports ${maxCh}ch.` : "Please select at least one note.";
         ctx.close(); return;
       }

       playButton.disabled = true;
       const now = ctx.currentTime;
       selections.forEach(({freq, channel}) => {
         const osc = ctx.createOscillator();
         const gain = ctx.createGain();
         osc.frequency.value = freq;
         gain.gain.setValueAtTime(0, now);
         gain.gain.linearRampToValueAtTime(0.15, now + 0.01);
         gain.gain.setValueAtTime(0.15, now + 1.2);
         gain.gain.linearRampToValueAtTime(0, now + 1.5);
         osc.connect(gain);
         gain.connect(merger, 0, channel);
         osc.start(now); osc.stop(now + 1.5);
       });
       merger.connect(ctx.destination);
       setTimeout(() => { playButton.disabled = false; ctx.close(); }, 1500);
     });
    </script>
  </body>
</html>
